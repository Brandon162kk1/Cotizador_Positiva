[supervisord]
nodaemon=true
user=root
loglevel=warn

[program:xvfb]
command=Xvfb :%(ENV_DISPLAY_NUM)s -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:openbox]
command=openbox
environment=DISPLAY=":%(ENV_DISPLAY_NUM)s"
autorestart=true
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :%(ENV_DISPLAY_NUM)s -forever -passwd %(ENV_pass_enGrafico)s -shared -rfbport %(ENV_VNC_PORT)s -viewonly
autorestart=true
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=40
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:app]
command=python Codigo/main.py
directory=/app
environment=DISPLAY=":%(ENV_DISPLAY_NUM)s",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=50
